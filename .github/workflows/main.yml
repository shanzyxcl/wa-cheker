name: WhatsApp Number Checker

on:
  workflow_dispatch:
    inputs:
      delay:
        description: 'Delay between checks (seconds)'
        required: false
        default: '3'
      batch_size:
        description: 'Auto-save interval'
        required: false
        default: '10'

jobs:
  check-numbers:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Send start notification
      run: |
        curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d parse_mode="Markdown" \
          -d text="🚀 *WA Number Checker Started*%0A%0A⏰ Time: $(date +'%Y-%m-%d %H:%M:%S')%0A📊 Status: Processing..."
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install selenium requests
    
    - name: Install Chrome and ChromeDriver
      run: |
        sudo apt-get update
        sudo apt-get install -y chromium-browser chromium-chromedriver
    
    - name: Verify numbers file exists
      run: |
        if [ ! -f numbers.txt ]; then
          echo "❌ File numbers.txt tidak ditemukan di repository!"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="Markdown" \
            -d text="❌ *ERROR*%0A%0AFile \`numbers.txt\` tidak ditemukan di repository!"
          exit 1
        fi
        TOTAL_NUMBERS=$(wc -l < numbers.txt)
        echo "✅ File numbers.txt ditemukan"
        echo "Total nomor: $TOTAL_NUMBERS"
        
        curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d parse_mode="Markdown" \
          -d text="✅ *File Loaded*%0A%0A📱 Total numbers: *${TOTAL_NUMBERS}*%0A⏱ Delay: *${{ github.event.inputs.delay }}s*"
        
    - name: Create checker script
      run: |
        cat > wa_checker_headless.py << 'EOFPY'
        from selenium import webdriver
        from selenium.webdriver.common.by import By
        from selenium.webdriver.support.ui import WebDriverWait
        from selenium.webdriver.support import expected_conditions as EC
        from selenium.webdriver.chrome.options import Options
        from selenium.webdriver.chrome.service import Service
        from selenium.common.exceptions import TimeoutException, NoSuchElementException
        import time
        import json
        import sys
        import os
        import requests
        from datetime import datetime
        
        class WACheckerHeadless:
            def __init__(self):
                self.options = Options()
                self.options.add_argument('--headless')
                self.options.add_argument('--no-sandbox')
                self.options.add_argument('--disable-dev-shm-usage')
                self.options.add_argument('--disable-gpu')
                self.options.add_argument('--disable-blink-features=AutomationControlled')
                self.options.add_argument('--user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36')
                
                self.service = Service('/usr/bin/chromedriver')
                self.driver = None
                self.results = {
                    'active': [],
                    'inactive': [],
                    'errors': []
                }
                
                # Telegram config
                self.bot_token = os.getenv('TELEGRAM_BOT_TOKEN')
                self.chat_id = os.getenv('TELEGRAM_CHAT_ID')
            
            def send_telegram(self, message):
                """Send message to Telegram"""
                if not self.bot_token or not self.chat_id:
                    return
                try:
                    url = f"https://api.telegram.org/bot{self.bot_token}/sendMessage"
                    data = {
                        'chat_id': self.chat_id,
                        'text': message,
                        'parse_mode': 'Markdown'
                    }
                    requests.post(url, data=data)
                except:
                    pass
            
            def start(self):
                print("🚀 Starting headless Chrome...")
                self.driver = webdriver.Chrome(service=self.service, options=self.options)
                
            def check_via_api(self, number):
                """Check using wa.me redirect method"""
                url = f"https://wa.me/{number}"
                result = {
                    'number': number,
                    'status': 'unknown',
                    'timestamp': datetime.now().isoformat()
                }
                
                try:
                    self.driver.get(url)
                    time.sleep(2)
                    
                    current_url = self.driver.current_url
                    page_source = self.driver.page_source.lower()
                    
                    # Check if redirected to chat
                    if 'send?phone=' in current_url or 'chat' in current_url:
                        # Check for error messages
                        if 'phone number shared via url is invalid' in page_source:
                            result['status'] = 'inactive'
                            result['reason'] = 'Invalid number'
                        elif 'no account with that number' in page_source:
                            result['status'] = 'inactive'
                            result['reason'] = 'No WhatsApp account'
                        else:
                            result['status'] = 'active'
                    else:
                        result['status'] = 'inactive'
                        result['reason'] = 'No redirect to chat'
                    
                except Exception as e:
                    result['status'] = 'error'
                    result['error'] = str(e)
                
                return result
            
            def check_numbers(self, numbers, delay=3, batch_size=10):
                total = len(numbers)
                print(f"\n{'='*60}")
                print(f"Checking {total} numbers...")
                print(f"{'='*60}\n")
                
                for i, number in enumerate(numbers, 1):
                    print(f"[{i}/{total}] Checking +{number}...", end=' ')
                    
                    result = self.check_via_api(number)
                    
                    if result['status'] == 'active':
                        self.results['active'].append(result)
                        print("✅ ACTIVE")
                    elif result['status'] == 'inactive':
                        self.results['inactive'].append(result)
                        print(f"❌ INACTIVE ({result.get('reason', 'Unknown')})")
                    else:
                        self.results['errors'].append(result)
                        print(f"⚠️ ERROR: {result.get('error', 'Unknown')}")
                    
                    # Send progress update every batch_size
                    if i % batch_size == 0:
                        active_count = len(self.results['active'])
                        inactive_count = len(self.results['inactive'])
                        error_count = len(self.results['errors'])
                        progress = (i / total) * 100
                        
                        msg = f"📊 *Progress Update*\n\n"
                        msg += f"✅ Active: *{active_count}*\n"
                        msg += f"❌ Inactive: *{inactive_count}*\n"
                        msg += f"⚠️ Errors: *{error_count}*\n"
                        msg += f"📈 Progress: *{i}/{total}* ({progress:.1f}%)"
                        
                        self.send_telegram(msg)
                    
                    if i < total:
                        time.sleep(delay)
            
            def save_results(self):
                # JSON result
                output = {
                    'timestamp': datetime.now().isoformat(),
                    'summary': {
                        'total': len(self.results['active']) + len(self.results['inactive']) + len(self.results['errors']),
                        'active': len(self.results['active']),
                        'inactive': len(self.results['inactive']),
                        'errors': len(self.results['errors'])
                    },
                    'results': self.results
                }
                
                with open('wa_results.json', 'w') as f:
                    json.dump(output, f, indent=2)
                
                # Active numbers only
                with open('wa_active_numbers.txt', 'w') as f:
                    f.write("="*60 + "\n")
                    f.write("NOMOR WHATSAPP AKTIF\n")
                    f.write("="*60 + "\n\n")
                    for item in self.results['active']:
                        f.write(f"+{item['number']}\n")
                    f.write(f"\nTotal: {len(self.results['active'])} nomor aktif\n")
                
                print("\n" + "="*60)
                print("📊 SUMMARY")
                print("="*60)
                print(f"✅ Active    : {len(self.results['active'])}")
                print(f"❌ Inactive  : {len(self.results['inactive'])}")
                print(f"⚠️ Errors    : {len(self.results['errors'])}")
                print(f"📝 Total     : {output['summary']['total']}")
                print("="*60)
                
                # Send final summary to Telegram
                msg = f"✅ *Check Complete!*\n\n"
                msg += f"📊 *SUMMARY*\n"
                msg += f"✅ Active: *{len(self.results['active'])}*\n"
                msg += f"❌ Inactive: *{len(self.results['inactive'])}*\n"
                msg += f"⚠️ Errors: *{len(self.results['errors'])}*\n"
                msg += f"📝 Total: *{output['summary']['total']}*\n\n"
                msg += f"⏰ Time: {datetime.now().strftime('%Y-%m-%d %H:%M:%S')}"
                
                self.send_telegram(msg)
                
                # Send active numbers if any
                if self.results['active']:
                    active_list = "\n".join([f"+{item['number']}" for item in self.results['active'][:10]])
                    msg = f"📱 *Active Numbers (Top 10)*\n\n{active_list}"
                    if len(self.results['active']) > 10:
                        msg += f"\n\n_...and {len(self.results['active']) - 10} more_"
                    self.send_telegram(msg)
            
            def close(self):
                if self.driver:
                    self.driver.quit()
        
        if __name__ == "__main__":
            # Read numbers from repository file
            with open('numbers.txt', 'r') as f:
                numbers = [line.strip() for line in f if line.strip()]
            
            if not numbers:
                print("❌ File numbers.txt kosong!")
                sys.exit(1)
            
            print(f"✅ Loaded {len(numbers)} numbers from numbers.txt")
            
            delay = int(sys.argv[1]) if len(sys.argv) > 1 else 3
            batch_size = int(sys.argv[2]) if len(sys.argv) > 2 else 10
            
            checker = WACheckerHeadless()
            try:
                checker.start()
                checker.check_numbers(numbers, delay=delay, batch_size=batch_size)
                checker.save_results()
            except Exception as e:
                print(f"❌ Fatal error: {e}")
                checker.send_telegram(f"❌ *Fatal Error*\n\n```\n{str(e)}\n```")
            finally:
                checker.close()
        EOFPY
    
    - name: Run checker
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python wa_checker_headless.py ${{ github.event.inputs.delay }} ${{ github.event.inputs.batch_size }}
    
    - name: Upload results
      uses: actions/upload-artifact@v4
      with:
        name: wa-check-results
        path: |
          wa_results.json
          wa_active_numbers.txt
    
    - name: Display results
      if: always()
      run: |
        echo "📊 Results:"
        if [ -f wa_results.json ]; then
          cat wa_results.json
        fi
        echo ""
        echo "✅ Active numbers:"
        if [ -f wa_active_numbers.txt ]; then
          cat wa_active_numbers.txt
        fi
    
    - name: Commit results
      if: success()
      run: |
        git config --local user.email "justinaxie911@gmail.com"
        git config --local user.name "shanzyxcl"
        git add -f wa_results.json wa_active_numbers.txt || true
        git commit -m "Update WA check results - $(date +'%Y-%m-%d %H:%M:%S')" || true
        git push || true
    
    - name: Send error notification
      if: failure()
      run: |
        curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d parse_mode="Markdown" \
          -d text="❌ *Workflow Failed!*%0A%0A⏰ Time: $(date +'%Y-%m-%d %H:%M:%S')%0A🔗 Check logs: https://github.com/${{ github.repository }}/actions"
